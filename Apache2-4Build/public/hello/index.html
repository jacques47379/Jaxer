<!-- 2 ways to interact wihth jaxer
1. on server load, server performs an action, which changes the dom.
2. on client action. Server perform a command. Return control to the client and perform a subsequent action.
-->

<html>
<head>
<!-- Mke sure both server and client can access jquery-->
  <script src="http://code.jquery.com/jquery.js" runat="both"></script>
  <script>
//When the form submit button is clicked, tell the server to perform an action, then client does nothing. 
    jQuery(function($){
      $("form").submit(function(){
        callJaxer();
        return false;
      });
    });
  </script>
  <script runat="server">
//Client tells the server to perform a server side command, save the text file.
    function callJaxer(){
      $("textarea").val("hello from jaxer");
    }
    callJaxer.proxy = true;

    function load(){
      $("textarea").val("hello");
    }
  </script>
</head>
<!--When page is loaded, load text from file. If file does not exist. Create file.-->
<body onserverload="load()">
<!--generic HTML form-->
<h2>Try It!!</h2>
  <form action="" method="post">
    <textarea></textarea>
    <input label="Click Me!!" type="submit"/>
  </form>
</body>
</html>
