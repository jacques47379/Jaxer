    <script type="text/javascript">

        function buildFighter(fighter){
            serverBuildFighter.async(buildFighterResponse, "hello");
        }

        function buildFighterResponse(tempResultsArray){
            var ele = document.getElementById("fighterSelectText");
		    ele.innerHTML = '<option value="">-- Select --</option>';
		    for (let i = 0; i < tempResultsArray.rows.length; i++) {
		        ele.innerHTML = ele.innerHTML +
			    '<option value="' + tempResultsArray.rows[i].name + '">' + tempResultsArray.rows[i].name + '</option>';
		    };
            ele = document.getElementById("techniqueSelectText");
            ele.selectedIndex = 0;
            buildTechnique("hello");
        }    
        
        function selectFighter(fighter){
            var ele = document.getElementById("fighterSelectText");
            var eleIndex = ele.selectedIndex; // Get the index of the selected option
            var eleText = ele.options[eleIndex].text; // Access the option at that index and get its text

            if(eleIndex > 0){
                serverSelectFighter.async(selectFighterResponse, eleText);
            }
            if(eleIndex === 0){
                var ele = document.getElementById("fighterAge");
                ele.innerHTML = "";
                ele = document.getElementById("fighterCountry");
                ele.innerHTML = "";
                ele = document.getElementById("fighterStyle");
                ele.innerHTML = "";
                ele = document.getElementById("fighter-avatar");
                ele.src = "img/no_fighter.png";
            }
        }

        function selectFighterResponse(tempResultsArray){
            var ele = document.getElementById("fighterAge");
		    ele.innerHTML = tempResultsArray.age;
            ele = document.getElementById("fighterCountry");
		    ele.innerHTML = tempResultsArray.country;
            ele = document.getElementById("fighterStyle");
		    ele.innerHTML = tempResultsArray.style;
            ele = document.getElementById("fighter-avatar");
            ele.src = tempResultsArray.image;
            deselectTechnique("hello");
        } 

        function buildTechnique(fighter){
            var ele = document.getElementById("fighterSelectText");
            var eleIndex = ele.selectedIndex; // Get the index of the selected option
            var eleText = ele.options[eleIndex].text; // Access the option at that index and get its text
            if(eleIndex > 0){
                serverBuildTechnique.async(buildTechniqueResponse, eleText);
            }
        }

        function buildTechniqueResponse(tempResultsArray){ 
            ele = document.getElementById("techniqueSelectText");
		    ele.innerHTML = '<option value="">-- Select --</option>';
		    for (let i = 0; i < tempResultsArray.rows.length; i++) {
		        ele.innerHTML = ele.innerHTML +
			    '<option value="' + tempResultsArray.rows[i].name + '">' + tempResultsArray.rows[i].name + '</option>';
		    };
        }  

        function selectTechnique(technique){
            var ele = document.getElementById("techniqueSelectText");
            var eleIndex = ele.selectedIndex; // Get the index of the selected option
            var eleText = ele.options[eleIndex].text; // Access the option at that index and get its text
            
            serverSelectTechnique.async(selectTechniqueResponse, eleText);
        }

        function selectTechniqueResponse(tempResultsArray){
            deselectTechnique("hello");
            setTimeout("document.getElementById(" + "\"" + tempResultsArray.rows[0].file + "\"" + ").style.display = \"block\"", 500);
        } 

        function deselectTechnique(technique){           
            serverDeselectTechnique.async(deselectTechniqueResponse, "hello");
        }

        function deselectTechniqueResponse(tempResultsArray){
            for(var i = 0; tempResultsArray.rows.length-1; i++)
            {
                setTimeout("document.getElementById(" + "\"" + tempResultsArray.rows[i].file + "\"" + ").style.display = \"none\"", 200);
            }
        } 
    </script>

    <script type="text/javascript" runat="server">
		function initAuthentication() //Application starts here

            sql = "DROP TABLE IF EXISTS welcometostreetfighterlist";            // Drop the temporary storage table if it exists

                "( id INTEGER PRIMARY KEY AUTO_INCREMENT" +
                ", name VARCHAR(255) NOT NULL" +
                ", age INTEGER NOT NULL" +
                ", country VARCHAR(255) NOT NULL" +
                ", style VARCHAR(255) NOT NULL" +
                ", movesetid INTEGER NOT NULL" +
                ", image VARCHAR(255) NOT NULL" +
                ", UNIQUE (name)" +
                ")";            // Create a new temporary storage table with the required fields
            
            Jaxer.DB.execute(sql);


            Jaxer.DB.execute("INSERT INTO welcometostreetfighterlist (name, age, country, style, movesetid, image) VALUES (?, ?, ?, ?, ?, ?)",

            Jaxer.DB.execute("INSERT INTO welcometostreetfighterlist (name, age, country, style, movesetid, image) VALUES (?, ?, ?, ?, ?, ?)",
                ["sagat", 41, "Thailand", "Muay Thai", 2, "img/sagat.jpg"]);

            Jaxer.DB.execute("INSERT INTO welcometostreetfighterlist (name, age, country, style, movesetid, image) VALUES (?, ?, ?, ?, ?, ?)",
                ["chunli", 26, "Hong Kong", "Chinese Kempo", 3, "img/chunli.jpg"]);

            sql = "DROP TABLE IF EXISTS welcometostreetfightermoveset";            // Drop the temporary storage table if it exists

            Jaxer.DB.execute(sql);

            sql = "CREATE TABLE IF NOT EXISTS welcometostreetfightermoveset" +
                "( id INTEGER PRIMARY KEY AUTO_INCREMENT" +
                ", moveid INTEGER NOT NULL" +
                ", movesetid INTEGER NOT NULL" +
                ", name VARCHAR(255) NOT NULL" +
                ", file VARCHAR(255) NOT NULL" +
                ", UNIQUE (moveid)" +
                ", FOREIGN KEY (movesetid) REFERENCES welcometostreetfighterlist(movesetid)" +
                ")";            // Create a new temporary storage table with the required fields

            Jaxer.DB.execute(sql);

            Jaxer.DB.execute("INSERT INTO welcometostreetfightermoveset (moveid, movesetid, name, file) VALUES (?, ?, ?, ?)",

            Jaxer.DB.execute("INSERT INTO welcometostreetfightermoveset (moveid, movesetid, name, file) VALUES (?, ?, ?, ?)",

        }

    <script type="text/javascript" runat="server-proxy">    // This script block will execute only on the server with a prxy to the user because of the runat="server-proxy" attributes. -->
        function serverBuildFighter(filler){
              var rs = Jaxer.DB.execute("SELECT l.name FROM welcometostreetfighterlist l");              // Create a new temporary storage table with the required fields        
            return rs;             // Select the single record from the database
        }

        function serverSelectFighter(fighter){
              var rs = Jaxer.DB.execute("SELECT l.age, l.country, l.style, l.image FROM welcometostreetfighterlist l WHERE l.name = ?",
                    [fighter]);   // Create a new temporary storage table with the required fields   
            var tempstorage = rs.rows[0];// Select the single record from the database
            return tempstorage;// Return the temporary storage variable to the calling function
        }

        function serverBuildTechnique(fighter){
            var rs = Jaxer.DB.execute("SELECT m.name FROM welcometostreetfighterlist l, " +
                        "welcometostreetfightermoveset m WHERE l.name = ? AND l.movesetid = m.movesetid", [fighter]);               // Create a new temporary storage table with the required fields     
            return rs;
        }

        function serverSelectTechnique(technique){
            var temparray = Jaxer.DB.execute("SELECT m.file FROM welcometostreetfightermoveset m where m.name = ?", [technique]);             // Create a new temporary storage table with the required fields
            return temparray;
        }

        function serverDeselectTechnique(technique){
            var temparray = Jaxer.DB.execute("SELECT m.file FROM welcometostreetfightermoveset m");              // Create a new temporary storage table with the required fields
            return temparray;
        }

    </script>
